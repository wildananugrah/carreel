services:
  minio:
    image: minio/minio:latest
    container_name: carreel-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: carreel
      MINIO_ROOT_PASSWORD: carreel_secret
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: carreel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ./init-buckets.sh:/init-buckets.sh:ro
    command: /init-buckets.sh

volumes:
  minio-data:
